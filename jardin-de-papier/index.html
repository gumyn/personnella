<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milo — L’archipel des possibles</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><a class="logo" href="./">✳ <span>MILO<small>L’ARCHIPEL DES POSSIBLES</small></span></a><div class="header-actions"><button id="mapButton">Les 15 mondes ↗</button><button id="sound">Son : non</button></div></header>
<section class="heading"><div><div class="eyebrow" id="chapter"></div><h1 id="levelName"></h1></div><p id="concept"></p></section>
<section class="stage"><canvas id="game" width="1100" height="620" tabindex="0" aria-label="Déplace Milo avec les flèches. Espace pour sauter, E pour agir, flèche bas pour plonger dans l’eau."></canvas><div class="hud"><span id="count">✦ 0 / 6</span><span id="region"></span><button id="pause">Pause Ⅱ</button></div><div id="prompt" class="prompt" hidden></div><div class="progress"><i id="progress"></i></div>
<div id="overlay" class="overlay"><article><span class="eyebrow" id="overline">UNE NOUVELLE EXPÉDITION</span><h2 id="title"></h2><p id="message"></p><button id="play" class="primary">Explorer →</button></article></div></section>
<div class="touch"><button data-key="left" aria-label="Gauche">←</button><button data-key="right" aria-label="Droite">→</button><button data-key="down" aria-label="Plonger">↓</button><button id="actTouch">Agir ✋</button><button data-key="jump">Sauter ↑</button></div>
<section class="under"><div class="observation"><span>LE PETIT LABO</span><p id="hint" aria-live="polite"></p></div><div class="tools"><button id="clue">Un indice ✧</button><button id="retry">Recommencer ↺</button></div></section><footer><span>← → Marcher &nbsp; Espace Sauter &nbsp; E Agir &nbsp; ↓ Descendre / plonger &nbsp; P Pause</span><span>Un dessin devenu explorateur. Sans chrono, sans vies perdues.</span></footer></main>
<dialog id="atlas"><div class="atlas-head"><div><span class="eyebrow">LE CARNET D’EXPLORATION</span><h2>Quinze mondes.<br>Quinze façons de s’émerveiller.</h2></div><button id="closeMap" aria-label="Fermer la carte">Fermer ×</button></div><div id="levelCards"></div></dialog>
<script src="levels.js"></script><script src="game.js"></script><script src="character.js"></script><script src="render.js"></script></body></html>
